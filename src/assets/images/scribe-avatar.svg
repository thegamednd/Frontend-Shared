<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2318"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#c9a84c" stroke-width="2"/>
  <!-- Scroll body -->
  <rect x="30" y="25" width="32" height="50" rx="2" fill="#1a1610" stroke="#8b7340" stroke-width="1.5"/>
  <rect x="32" y="28" width="28" height="44" rx="1" fill="#211c14"/>
  <!-- Scroll lines -->
  <line x1="35" y1="35" x2="57" y2="35" stroke="#5a4a2a" stroke-width="1"/>
  <line x1="35" y1="41" x2="57" y2="41" stroke="#5a4a2a" stroke-width="1"/>
  <line x1="35" y1="47" x2="57" y2="47" stroke="#5a4a2a" stroke-width="1"/>
  <line x1="35" y1="53" x2="52" y2="53" stroke="#5a4a2a" stroke-width="1"/>
  <line x1="35" y1="59" x2="48" y2="59" stroke="#5a4a2a" stroke-width="1"/>
  <!-- Quill -->
  <g transform="rotate(-35, 62, 42)">
    <!-- Feather -->
    <path d="M62 15 C58 25, 54 35, 58 55 L62 55 C66 35, 66 25, 62 15Z" fill="#c9a84c" opacity="0.9"/>
    <line x1="60" y1="55" x2="60" y2="70" stroke="#8b7340" stroke-width="1.5"/>
    <!-- Nib -->
    <path d="M59 70 L60 78 L61 70Z" fill="#c9a84c"/>
  </g>
  <!-- Glow accent -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
</svg>
